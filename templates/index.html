
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            padding: 40px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #1976d2;
            outline: none;
            box-shadow: 0 0 6px rgba(25, 118, 210, 0.2);
        }

        .submit-btn {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            background: #1976d2;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: #125ea9;
        }

        .prediction-box {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Customer Churn Prediction</h1>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="field">
                <label>Gender</label>
                <select name="Gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="field">
                <label>Senior Citizen</label>
                <select name="Senior Citizen" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Partner</label>
                <select name="Partner" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Dependents</label>
                <select name="Dependents" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Tenure Months</label>
                <input type="number" name="Tenure Months" min="0" max="120" placeholder="e.g. 24" required>
            </div>

            <div class="field">
                <label>Phone Service</label>
                <select name="Phone Service" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Multiple Lines</label>
                <select name="Multiple Lines" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No phone service">No phone service</option>
                </select>
            </div>

            <div class="field">
                <label>Internet Service</label>
                <select name="Internet Service" required>
                    <option value="">Select</option>
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Online Security</label>
                <select name="Online Security" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Online Backup</label>
                <select name="Online Backup" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Device Protection</label>
                <select name="Device Protection" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Tech Support</label>
                <select name="Tech Support" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Streaming TV</label>
                <select name="Streaming TV" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Streaming Movies</label>
                <select name="Streaming Movies" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="field">
                <label>Contract</label>
                <select name="Contract" required>
                    <option value="">Select</option>
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>

            <div class="field">
                <label>Paperless Billing</label>
                <select name="Paperless Billing" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="field">
                <label>Payment Method</label>
                <select name="Payment Method" required>
                    <option value="">Select</option>
                    <option value="Electronic check">Electronic check</option>
                    <option value="Mailed check">Mailed check</option>
                    <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                    <option value="Credit card (automatic)">Credit card (automatic)</option>
                </select>
            </div>

            <div class="field">
                <label>Monthly Charges</label>
                <input type="number" step="0.01" name="Monthly Charges" min="0" max="500" placeholder="e.g. 85.75" required>
            </div>

            <div class="field">
                <label>Total Charges</label>
                <input type="number" step="0.01" name="Total Charges" min="0" placeholder="e.g. 1200.50" required>
            </div>

            <div class="field">
                <label>CLTV</label>
                <input type="number" name="CLTV" min="0" placeholder="e.g. 3500" required>
            </div>

        </div>

        <button type="submit" class="submit-btn">Predict Customer Churn</button>

    </form>

    {% if prediction_text %}
    <div class="prediction-box">
        <h2>{{ prediction_text }}</h2>
        <h3>Probability: {{ probability }}</h3>
    </div>
    {% endif %}

</div>

</body>
</html>
